# Aggiorna worldmapai.json ogni lunedì alle 06:00 UTC (08:00 in Italia d'estate, 07:00 d'inverno).
# Si può avviare anche a mano: scheda "Actions" › "Aggiorna WorldMapAI" › "Run workflow".
name: Aggiorna WorldMapAI

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aggiorna l'elenco
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node scripts/update.mjs
      - name: Salva le modifiche
        run: |
          if git diff --quiet -- worldmapai.json; then
            echo "Nessuna modifica"
          else
            git config user.name "worldmapai-bot"
            git config user.email "worldmapai-bot@users.noreply.github.com"
            git add worldmapai.json
            git commit -m "Aggiornamento settimanale WorldMapAI ($(date -u +%Y-%m-%d))"
            git push
          fi
